[workspace]
resolver = "3"
members = ["crates/itop-kit", "src-tauri"]

[workspace.package]
version = "2.3.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }

[profile.release]
lto = "thin"

# Proc macros and build scripts: Cargo's default release stripping makes the current macOS linker
# write proc-macro dylibs that won't load ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
